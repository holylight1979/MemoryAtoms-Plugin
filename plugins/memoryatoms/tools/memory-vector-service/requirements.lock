# Vector service packages, every version pinned. tools/setup-vector.py installs exactly this list into the
# vector venv (plugin edition: ${CLAUDE_PLUGIN_DATA}/venv) with --only-binary=:all:. requirements.txt stays the
# loose list the git installer uses.
#
# How these pins were chosen: lancedb is the version running on the author's machine (pip show lancedb);
# the rest is its runtime dependency closure read from that install (importlib.metadata requires, extras
# dropped, markers kept), and each pin's requires_python checked on https://pypi.org/pypi/<name>/<version>/json.
# numpy 2.4 needs Python 3.11+, so Python 3.10 gets 2.2.6. overrides is only required below Python 3.12.
# To re-pin: install the new lancedb in a scratch venv, then `python -m pip freeze` there and copy the lines.
